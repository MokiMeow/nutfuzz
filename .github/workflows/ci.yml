name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: sudo apt-get update && sudo apt-get install -y cargo rustc

      - name: Build (warnings are failures)
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --release --all-targets

      - name: Test
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --release --all-targets

      - name: Markdown punctuation policy
        run: |
          if grep -RIl --include='*.md' $'\u2014' .; then
            echo 'first-party Markdown must not contain em dash characters'
            exit 1
          fi

      - name: It finds the planted bug
        run: |
          out=$(cargo run --release --quiet)
          echo "$out"
          echo "$out" | grep -q "1 unique bug(s)"

      - name: It reports nothing on the fixed target (no false positives)
        run: |
          out=$(cargo run --release --quiet -- --target parse_record_fixed --iterations 200000)
          echo "$out"
          echo "$out" | grep -q "no crashes found"

      - name: External harness stays quiet on a clean program
        run: |
          out=$(cargo run --release --quiet -- --external /bin/true --iterations 20 --seed 42)
          echo "$out"
          echo "$out" | grep -q "no crashes or hangs found"

      - name: Structured fixup reaches its owned target
        run: |
          out=$(cargo run --release --quiet -- \
            --target parse_checksum --dict CHECK --fixup checksum \
            --seed 41 --iterations 2000)
          echo "$out"
          echo "$out" | grep -q "checksum-gated structured input accepted"

      - name: Optional AFL++ owned-target comparison
        run: ./scripts/benchmark-aflpp.sh
