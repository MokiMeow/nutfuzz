name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: sudo apt-get update && sudo apt-get install -y cargo rustc

      - name: Build (warnings are failures)
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --release

      - name: Test
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --release

      - name: It finds the planted bug
        run: |
          out=$(cargo run --release --quiet)
          echo "$out"
          echo "$out" | grep -q "crash(es) found"

      - name: It reports nothing on the fixed target (no false positives)
        run: |
          out=$(cargo run --release --quiet -- --target parse_record_fixed --iterations 200000)
          echo "$out"
          echo "$out" | grep -q "no crashes found"

      - name: External harness stays quiet on a clean program
        run: |
          out=$(cargo run --release --quiet -- --external /bin/true --iterations 20 --seed 42)
          echo "$out"
          echo "$out" | grep -q "no crashes or hangs found"
