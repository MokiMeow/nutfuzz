[package]
name = "nutfuzz"
version = "1.2.1"
edition = "2021"
default-run = "nutfuzz"
description = "A coverage-guided fuzzer built from the mutation engine up"
license = "MIT"

# No dependencies: the PRNG, the mutation engine, the corpus scheduler and the
# coverage feedback loop are the project. See docs/decisions/.
[dependencies]

[profile.release]
opt-level = 3
debug = true          # keep symbols so crash backtraces are readable
